<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyek Code Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b1533">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keyek">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3fb; --ink:#201a33; --muted:#6a6382; --card:#ffffff; --line:#ded7ee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16122a; --ink:#f1edfc; --muted:#a9a2c4; --card:#211b3d; --line:#38305c;}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:clamp(2.4rem,9vw,4.6rem);line-height:1;letter-spacing:-.03em;font-weight:800;margin:0 0 14px}
.sub{color:var(--muted);font-size:1.1rem;max-width:34em;margin:0 0 40px}
h2{font-size:1.15rem;font-weight:700;margin:40px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none}
.top{height:140px;background:var(--c);overflow:hidden}
.top svg{width:100%;height:100%;display:block}
.hero{display:block;border-radius:22px;overflow:hidden;margin-bottom:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.hero .top{height:220px}
.hero .info{padding:18px 20px 22px}
.hero .badge{display:inline-block;background:#6d3df5;color:#fff;font-weight:700;font-size:.75rem;padding:4px 10px;border-radius:10px;margin-bottom:8px}
.hero h2{margin:0 0 4px;font-size:1.8rem;letter-spacing:-.02em}
.hero p{margin:0 0 14px;color:var(--muted)}
.hero .play{display:inline-flex;align-items:center;min-height:44px;padding:0 24px;border-radius:22px;background:#6d3df5;color:#fff;font-weight:700}
.hero:hover{border-color:var(--ink)}
.hero:focus-visible{outline:3px solid #7c4dff;outline-offset:3px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:1.25rem;letter-spacing:-.01em}
.body p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.go{margin-top:10px;font-weight:700;font-size:.95rem}
a.card:hover{border-color:var(--ink)}
a.card:focus-visible{outline:3px solid #7c4dff;outline-offset:3px}
.soon .go{color:var(--muted);font-weight:400}
@media(max-width:640px){.grid{gap:10px}.top{height:90px}.body{padding:10px}.body h3{font-size:.95rem}.body p{font-size:.75rem;line-height:1.35}.go{font-size:.8rem;margin-top:4px}}
.brand{display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:16px;margin-bottom:28px}
.logo{flex:none;border-radius:18px;background:#6d3df5;color:#fff;padding:12px 20px;font-weight:800;font-size:clamp(1.8rem,8vw,2.6rem);letter-spacing:.04em;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1}
.logo span{color:#ffd84d}
.bmc{display:inline-flex;align-items:center;gap:10px;background:#ffdd00;color:#1a1a1a;text-decoration:none;font-weight:700;font-size:1rem;padding:11px 20px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .15s}
.bmc:hover{transform:translateY(-1px)}
.bmc-icon{width:48px;height:48px;padding:0;gap:0;justify-content:center;flex:none}
.bmc-icon svg{width:24px;height:24px}
.bmc:focus-visible{outline:3px solid #7c4dff;outline-offset:3px}
.bmc svg{width:20px;height:20px;flex:none}
footer{text-align:center;padding-top:36px;border-top:1px solid var(--line)}
footer p{margin:18px 0 0}
footer{margin-top:56px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="logo" role="img" aria-label="KE{Y}EK logo">KE<span>{Y}</span>EK</div><a class="bmc bmc-icon" aria-label="Buy me a coffee" title="Buy me a coffee" href="https://buymeacoffee.com/keyek" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h12v4a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v2M11 3v2M14 3v2"/></svg></a></div>
  <h1>Keyek Code Studio</h1>
  <p class="sub">Games and apps I build. Tap any card to open it.</p>

  <div id="hero"></div>

  <h2>Apps</h2>
  <div class="grid" id="apps"></div>

  <h2>Games</h2>
  <div class="grid" id="games"></div>

  <footer><a class="bmc" href="https://buymeacoffee.com/keyek" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h12v4a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v2M11 3v2M14 3v2"/></svg>Buy me a coffee</a><p>Enjoying the games? Your support keeps new ones coming.<br>Keyek Code Studio. Built by Josh.</p></footer>
</main>

<script>
/* EDIT HERE: put each project's real link in "url". Leave it "" to show "Link coming soon". */
const games = [
  {name:"Blocktopia", icon:"🧱", color:"#cfe3ff", desc:"Minigame hub with online rooms.", url:"https://keyek302.github.io/Blocktopia/"},
  {name:"Pipe Merge", icon:"🔮", color:"#e3d6ff", desc:"Merge items to reach the goal.", url:"https://keyek302.github.io/PipeMerge/"},
  {name:"Bingo", icon:"🎱", color:"#ffe3f1", desc:"Bingo with up to 4 boards.", url:"https://keyek302.github.io/Bingo/"},
  {name:"Sweet Pop", icon:"🍬", color:"#ffe9c9", desc:"Match-3 puzzle. No ads, no paywalls.", url:"https://keyek302.github.io/SweetPop/"},
  {name:"Medieval RPG", icon:"🐉", color:"#d6f2dc", desc:"Old school RPG with dragons.", url:""},
  {name:"Dino Survival", icon:"🦖", color:"#d9f0c8", desc:"First-person dinosaur survival.", url:"https://keyek302.github.io/DinoSurvival/"},
  {name:"Arrow Puzzles", icon:"", color:"#dbe7ff", desc:"Arrow puzzles to solve.", url:"https://keyek302.github.io/ArrowPuzzles"},
  {name:"Dress-Up Dreams", icon:"", color:"#f3dcff", desc:"Dress-up game with princesses.", url:"https://keyek302.github.io/DressupDreams/"},
  {name:"Tycoon Town", icon:"", color:"#d9f5e6", desc:"Kid-friendly board game. Play online.", url:"https://keyek302.github.io/TycoonTown/"},
  {name:"Block Fill", icon:"", color:"#ffe0d6", desc:"Block puzzle. Fill rows and columns.", url:"https://keyek302.github.io/BlockFill/"}
];
const apps = [
  {name:"Shift Watch", icon:"⏱️", color:"#d4f1f4", desc:"Earnings stopwatch for work shifts.", url:"https://keyek302.github.io/ShiftWatch/"},
  {name:"Penny Budgeter", icon:"", color:"#fff0c9", desc:"Track pay versus bills at a glance.", url:"https://keyek302.github.io/PennyBudgeter/"},
  {name:"Flip Deck", icon:"", color:"#ffd9c2", desc:"Study flashcards for kids and adults.", url:"https://keyek302.github.io/FlipCards/"}
];
const S=b=>`<svg viewBox='0 0 300 140' preserveAspectRatio='xMidYMid slice' aria-hidden='true'>${b}</svg>`;
const art={
'Blocktopia':S(`<circle cx='255' cy='28' r='14' fill='#ffd84d'/><rect y='95' width='300' height='45' fill='#6cc36a'/><rect x='40' y='61' width='34' height='34' fill='#e8643c'/><rect x='74' y='61' width='34' height='34' fill='#f2b134'/><rect x='57' y='27' width='34' height='34' fill='#4a8df0'/><ellipse cx='215' cy='74' rx='30' ry='38' fill='none' stroke='#7c4dff' stroke-width='9'/><ellipse cx='215' cy='74' rx='20' ry='28' fill='#c9b6ff'/>`),
'Pipe Merge':S(`<polygon points='40,125 80,55 220,55 260,125' fill='#8a5a3c'/><polygon points='80,55 220,55 214,48 86,48' fill='#a87250'/><circle cx='120' cy='90' r='16' fill='#7c4dff'/><rect x='143' y='44' width='14' height='40' rx='6' fill='#4cc3a8'/><circle cx='150' cy='88' r='22' fill='#4cc3a8'/><circle cx='188' cy='94' r='14' fill='#f06fa8'/>`),
'Bingo':S(`<rect x='60' y='14' width='110' height='112' rx='10' fill='#fff' stroke='#c04f94' stroke-width='3'/>${[0,1,2,3,4,5,6,7,8].map(i=>`<circle cx='${88+27*(i%3)}' cy='${42+28*Math.floor(i/3)}' r='9' fill='${[0,4,5,8].includes(i)?'#c04f94':'#f3d3e6'}'/>`).join('')}<circle cx='230' cy='70' r='34' fill='#7c4dff'/><text x='230' y='81' text-anchor='middle' font-size='30' font-weight='800' fill='#fff' font-family='sans-serif'>B7</text>`),
'Sweet Pop':S([...Array(18)].map((_,i)=>`<circle cx='${48+40*(i%6)}' cy='${30+40*Math.floor(i/6)}' r='17' fill='${['#f0527a','#f7a63b','#6cc36a','#4a8df0','#9b5de5'][(i*7+Math.floor(i/6))%5]}'/>`).join('')),
'Medieval RPG':S(`<circle cx='245' cy='32' r='16' fill='#ffd84d'/><rect y='100' width='300' height='40' fill='#5aa05a'/><rect x='95' y='50' width='110' height='56' fill='#8d8d9a'/><rect x='95' y='38' width='20' height='14' fill='#8d8d9a'/><rect x='140' y='38' width='20' height='14' fill='#8d8d9a'/><rect x='185' y='38' width='20' height='14' fill='#8d8d9a'/><path d='M135 106 v-26 a15 15 0 0 1 30 0 v26z' fill='#5b4636'/><path d='M25 42 q28 -26 56 0 q-28 -8 -56 0z' fill='#c0392b'/>`),
'Dino Survival':S(`<rect y='100' width='300' height='40' fill='#6cc36a'/><polygon points='40,100 60,45 80,100' fill='#2f7d46'/><polygon points='235,100 255,50 275,100' fill='#2f7d46'/><ellipse cx='150' cy='80' rx='42' ry='22' fill='#7a9e3a'/><path d='M108 80 q-40 -5 -62 18 q40 -6 62 -2z' fill='#7a9e3a'/><rect x='180' y='40' width='14' height='42' rx='6' fill='#7a9e3a'/><ellipse cx='198' cy='40' rx='20' ry='12' fill='#7a9e3a'/><circle cx='204' cy='36' r='3' fill='#222'/><rect x='135' y='96' width='10' height='20' fill='#5f7e2c'/><rect x='160' y='96' width='10' height='20' fill='#5f7e2c'/>`),
'Shift Watch':S(`<rect x='138' y='10' width='24' height='14' rx='4' fill='#2b6f77'/><circle cx='150' cy='80' r='50' fill='#fff' stroke='#2b6f77' stroke-width='8'/><line x1='150' y1='80' x2='150' y2='46' stroke='#2b6f77' stroke-width='5' stroke-linecap='round'/><line x1='150' y1='80' x2='174' y2='92' stroke='#e8643c' stroke-width='5' stroke-linecap='round'/><text x='215' y='60' font-size='34' font-weight='800' fill='#2b8a4e' font-family='sans-serif'>$</text>`),
'Dress-Up Dreams':S(`<path d='M130 24 h40 l-6 36 h-28z' fill='#f06fa8'/><path d='M132 58 h36 l42 66 h-120z' fill='#f06fa8'/><rect x='130' y='56' width='40' height='7' fill='#c04f94'/><path d='M240 30 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z' fill='#ffd84d'/><path d='M62 78 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z' fill='#9b5de5'/>`),
'Penny Budgeter':S(`<circle cx='110' cy='70' r='46' fill='#e9a23b'/><circle cx='110' cy='70' r='36' fill='none' stroke='#fff3c4' stroke-width='4'/><text x='110' y='84' text-anchor='middle' font-size='42' font-weight='800' fill='#fff3c4' font-family='sans-serif'>¢</text><rect x='190' y='70' width='18' height='40' rx='4' fill='#6cc36a'/><rect x='216' y='50' width='18' height='60' rx='4' fill='#4a8df0'/><rect x='242' y='85' width='18' height='25' rx='4' fill='#f0527a'/>`),
'Tycoon Town':S(`<rect x='95' y='15' width='110' height='110' rx='8' fill='#f3efe0'/>${['#8d5a3c','#4a8df0','#f0527a','#f7a63b','#6cc36a'].map((c,i)=>`<rect x='${95+22*i}' y='15' width='22' height='16' fill='${c}'/><rect x='${95+22*i}' y='109' width='22' height='16' fill='${c}'/>`).join('')}${[0,1,2].map(i=>`<rect x='95' y='${31+26*i}' width='16' height='26' fill='${['#9b5de5','#4cc3a8','#ffd84d'][i]}'/><rect x='189' y='${31+26*i}' width='16' height='26' fill='${['#ffd84d','#4cc3a8','#9b5de5'][i]}'/>`).join('')}<path d='M150 50 l24 20 h-7 v24 h-34 v-24 h-7z' fill='#e8643c'/><rect x='218' y='62' width='32' height='32' rx='7' fill='#fff' stroke='#444' stroke-width='2'/><circle cx='228' cy='72' r='3' fill='#222'/><circle cx='240' cy='84' r='3' fill='#222'/><circle cx='228' cy='84' r='3' fill='#222'/><circle cx='240' cy='72' r='3' fill='#222'/><circle cx='60' cy='62' r='16' fill='#ffd84d' stroke='#e9a23b' stroke-width='4'/>`),
'Block Fill':S(`<rect x='88' y='10' width='120' height='120' rx='8' fill='#6d3df5'/>`+[...Array(36)].map((_,i)=>{const r=Math.floor(i/6),c=i%6;const on=r>=4?(r==5||c!=4):(r==3&&c<2);return `<rect x='${92+19*c}' y='${14+19*r}' width='17' height='17' rx='3' fill='${on?['#f0527a','#f7a63b','#4a8df0','#6cc36a','#9b5de5','#ffd84d'][(r*2+c)%6]:'#ffffff'}'/>`}).join('')+`<rect x='230' y='40' width='17' height='17' rx='3' fill='#ffd84d'/><rect x='230' y='59' width='17' height='17' rx='3' fill='#ffd84d'/><rect x='230' y='78' width='17' height='17' rx='3' fill='#ffd84d'/><rect x='249' y='78' width='17' height='17' rx='3' fill='#ffd84d'/>`),
'Flip Deck':S(`<rect x='95' y='28' width='110' height='80' rx='10' fill='#9b7bff' transform='rotate(-8 150 68)'/><rect x='95' y='28' width='110' height='80' rx='10' fill='#fff' stroke='#6d3df5' stroke-width='3' transform='rotate(6 150 68)'/><text x='150' y='84' text-anchor='middle' font-size='46' font-weight='800' fill='#6d3df5' font-family='sans-serif' transform='rotate(6 150 68)'>?</text><path d='M236 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z' fill='#ffd84d'/>`),
'Arrow Puzzles':S(`<path d='M50 40 h80 m-24 -24 l24 24 l-24 24' fill='none' stroke='#4a8df0' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/><path d='M230 20 v80 m-24 -24 l24 24 l24 -24' fill='none' stroke='#f0527a' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/><path d='M250 120 h-120 m24 -24 l-24 24 l24 24' fill='none' stroke='#6cc36a' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/>`),
'Keyek Code Studio':S(`<text x='150' y='88' text-anchor='middle' font-size='54' font-weight='800' fill='#6d3df5' font-family='ui-monospace,Menlo,Consolas,monospace'>KE{Y}EK</text>`)
};
function render(list, id){
  const el = document.getElementById(id);
  list.forEach(p=>{
    const live = !!p.url;
    const a = document.createElement(live ? "a" : "div");
    a.className = "card" + (live ? "" : " soon");
    if(live){ a.href = p.url; a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<div class="top" style="--c:'+p.color+'">'+(art[p.name]||'')+'</div>'+
      '<div class="body"><h3>'+p.name+'</h3><p>'+p.desc+'</p>'+
      '<span class="go">'+(live ? "Open" : "Link coming soon")+'</span></div>';
    el.appendChild(a);
  });
}
const feat=games.concat(apps).find(p=>p.name==='Flip Deck');
render(games.filter(p=>p!==feat),'games'); render(apps.filter(p=>p!==feat),'apps');
const h=document.createElement('a');h.className='hero';h.href=feat.url;h.target='_blank';h.rel='noopener';h.style.setProperty('--c',feat.color);
h.innerHTML='<div class="top">'+art[feat.name].replace('slice','meet')+'</div><div class="info"><span class="badge">NEW</span><h2>'+feat.name+'</h2><p>'+feat.desc+'</p><span class="play">Open now</span></div>';
document.getElementById('hero').appendChild(h);
</script>
</body>
</html>
